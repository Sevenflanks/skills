name: Validate skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill repository
        run: npm run validate

  windows-checkout-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Windows git checkout ownership regression
        shell: pwsh
        run: ./test/windows-git-checkout.test.ps1

      - name: Verify checkout without Windows long paths
        shell: pwsh
        run: .\scripts\Test-WindowsGitCheckout.ps1 -SourcePath $env:GITHUB_WORKSPACE

  daily-work-log-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare isolated synthetic evidence and legacy Pester
        run: |
          if (-not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw 'Runner temporary parent is unavailable.' }
          $evidenceRoot = Join-Path $env:RUNNER_TEMP ('daily-work-log-evidence-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $evidenceRoot
          "DAILY_WORK_LOG_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # 既有 Should Be／Should Match 契約使用 Pester 4，不套用 v5 discovery 語意。
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Verify bounded collection and existing resource guards
        run: pwsh -NoProfile -File skills/daily-work-log/tests/bounded-collection.tests.ps1 -Case all -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify multi-source guards and fallback
        run: pwsh -NoProfile -File skills/daily-work-log/tests/multi-source.tests.ps1 -Case all

      - name: Verify legacy collector and formatter contracts
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $result = Invoke-Pester -Script skills/daily-work-log/tests/collect-daily-work-log.tests.ps1 -PassThru
          if ($result.TotalCount -eq 0 -or $result.FailedCount -gt 0) { throw 'Legacy daily-work-log contracts failed or no tests ran.' }

      - name: Verify read and dispose diagnostics
        run: pwsh -NoProfile -File skills/daily-work-log/tests/diagnostics.tests.ps1 -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify repository discovery and indexed SQL guards
        run: pwsh -NoProfile -File skills/daily-work-log/tests/repo-discovery.tests.ps1 -Case all -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify evidence view compatibility
        run: pwsh -NoProfile -File skills/daily-work-log/tests/evidence-view.tests.ps1 -Case all -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify OpenCode discovery aggregate diagnostics
        run: pwsh -NoProfile -File skills/daily-work-log/tests/opencode-diagnostics.tests.ps1 -Case all -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify bounded index and full compatibility views
        run: pwsh -NoProfile -File skills/daily-work-log/tests/index-view.tests.ps1 -Case all -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

      - name: Verify Windows 5.1 capture recipes and controlled consumer checkpoints
        run: pwsh -NoProfile -File skills/daily-work-log/tests/windows-capture.tests.ps1 -EvidenceRoot $env:DAILY_WORK_LOG_EVIDENCE_ROOT

  opencode-db-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify SQLite retention, read-only planning and Windows recovery
        run: python -m unittest discover -s skills/opencode-db-prune/tests -v
