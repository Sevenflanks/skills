name: Validate skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skill repository
        run: npm run validate

  windows-checkout-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout without Windows long paths
        shell: pwsh
        run: .\scripts\Test-WindowsGitCheckout.ps1 -SourcePath $env:GITHUB_WORKSPACE
